<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>脑力训练 · BrainTrain</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" id="backBtn" aria-label="返回" hidden>←</button>
    <h1 class="app-title">脑力训练</h1>
    <span class="app-sub">BrainTrain</span>
  </header>

  <main id="app" class="app-main"><!-- 模块内容由 js/app.js 路由渲染 --></main>

  <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
    <a href="#/" data-route="">🏠<span>首页</span></a>
    <a href="#/progress" data-route="progress">📈<span>进度</span></a>
  </nav>

  <!-- 经典脚本按依赖顺序加载（file:// 双击可直接运行） -->
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/data/numberPegsData.js"></script>
  <script src="js/data/cardCodes.js"></script>
  <script src="js/data/locations.js"></script>
  <script src="js/data/pegEmoji.js"></script>
  <script src="js/data/pegImages.js"></script>
  <script src="js/data/wordPegsData.js"></script>
  <script src="js/data/vocabLib.js"></script>
  <script src="js/data/locationPegs.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/numberPegs.js"></script>
  <script src="js/modules/playingCards.js"></script>
  <script src="js/modules/wordPegs.js"></script>
  <script src="js/modules/schulte.js"></script>
  <script src="js/modules/focus.js"></script>
  <script src="js/modules/auditory.js"></script>
  <script src="js/modules/visual.js"></script>
  <script src="js/modules/progress.js"></script>
  <script src="js/modules/daily.js"></script>
  <script src="js/modules/locationPegs.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Service Worker 仅在 http/https 下注册（file:// 不支持，且非必需）
    if ('serviceWorker' in navigator && ['http:', 'https:'].includes(location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => {
          console.warn('SW 注册失败（不影响使用）:', e);
        });
      });
    }
  </script>
</body>
</html>
